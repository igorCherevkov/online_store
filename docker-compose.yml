services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: online_store
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d online_store']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: 'postgresql://postgres:postgres@postgres:5432/online_store?schema=public'
      PORT: 3000
      PROVIDER_A_FAIL_RATE: 0.2
      PROVIDER_A_TIMEOUT_RATE: 0.2
      PROVIDER_B_FAIL_RATE: 0.1
      PROVIDER_B_TIMEOUT_RATE: 0.1
    ports:
      - '3000:3000'
    command: sh -c "npx prisma migrate deploy && npx prisma db seed && node dist/main"

volumes:
  postgres_data:
